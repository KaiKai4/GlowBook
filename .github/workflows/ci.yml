name: GlowBook CI

# Todos los jobs corren en cada PR y en cada push a main. No hay condiciones
# por rama ni "saltar en verde": si un control no puede ejecutarse, el job falla.
# Cada job delega en un único paso `npm run verify:job -- <job>`, que es el
# manifiesto de pasos de scripts/quality/steps.mjs (fuente de verdad).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glowbook-ci-${{ github.ref }}
  # En main no se cancela un run en curso (cada commit debe verificarse); en PR sí,
  # para ahorrar minutos al reenviar cambios.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Static (secretos, tokens, arquitectura, lint, tipos, auditoría)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify job static
        run: npm run verify:job -- static

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify job unit
        run: npm run verify:job -- unit

  db:
    name: Database (Supabase local, migraciones, tests SQL, integración)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Supabase local se arranca desde el runner (ensureLocalSupabase) sobre
      # Docker del propio runner. No se usan secretos.
      - name: Verify job db
        run: npm run verify:job -- db

  browser:
    name: Browser (build y E2E con Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Instalación del navegador (setup, no es un control de calidad).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify job browser
        run: npm run verify:job -- browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

  lighthouse:
    name: Lighthouse (rendimiento y accesibilidad)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Instalación del navegador (setup, no es un control de calidad). Lighthouse
      # usa el Chromium completo de Playwright (scripts/quality/run-lighthouse.mjs).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Ubuntu 24.04 restringe los user namespaces sin privilegios (AppArmor) y
      # Chromium aborta con "No usable sandbox". Se habilitan en el runner para
      # que Lighthouse lance Chrome CON sandbox (sin --no-sandbox). Setup del runner.
      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify job lighthouse
        run: npm run verify:job -- lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: warn

  sbom:
    name: SBOM (dependencias de producción)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify job sbom
        run: npm run verify:job -- sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: .quality/sbom.json
          retention-days: 90
          if-no-files-found: error

  codeql:
    name: CodeQL (análisis estático de seguridad, solo CI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript
